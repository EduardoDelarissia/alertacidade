
# ============================================
# ALERTACIDADE - ORACLE FIAP
# Perfil de producao
# ============================================

# CONEXAO COM ORACLE
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================
# CONFIGURACAO DO BANCO DE DADOS
# ============================================

# As tabelas ja devem existir no Oracle
# Criadas pelos scripts database/ddl.sql
spring.sql.init.mode=never

# Evita que o Hibernate altere as tabelas
spring.jpa.hibernate.ddl-auto=none

# ============================================
# POOL DE CONEXOES
# ============================================

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ============================================
# LOGS
# ============================================

logging.level.com.zaxxer.hikari=INFO
