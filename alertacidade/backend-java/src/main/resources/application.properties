spring.application.name=alertacidade-api
# Render injeta a variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Perfil padrao: dev (H2 em memoria, modo Oracle). Em producao/Render use SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Datas no JSON como texto ISO-8601 (2026-11-03T15:00:00)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

alertacidade.cors.origens=${CORS_ORIGENS:*}
