
# ==========================================
# ALERTACIDADE - AMBIENTE DE DESENVOLVIMENTO
# ==========================================

# Banco H2 em memoria, compativel com Oracle
spring.datasource.url=jdbc:h2:mem:alertacidade;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Inicializacao automatica do banco
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql
spring.sql.init.encoding=UTF-8

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
